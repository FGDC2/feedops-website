<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Feed excellence process graphic</title>
  <desc id="desc">A five step FeedOps process for auditing, fixing, expanding, monitoring, and improving product feeds.</desc>
  <rect width="1200" height="620" fill="#101820"/>
  <text x="80" y="104" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Feed excellence, one channel at a time</text>
  <text x="80" y="148" fill="#c9d3df" font-family="Inter, Arial, sans-serif" font-size="22">A practical path from feed problems to better product data and channel expansion.</text>
  <g transform="translate(80 236)">
    <rect x="0" y="0" width="178" height="170" rx="16" fill="#ffffff"/>
    <circle cx="36" cy="38" r="18" fill="#1c8c6f"/>
    <text x="30" y="45" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">1</text>
    <text x="26" y="88" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Audit</text>
    <text x="26" y="124" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="17">Find feed gaps,</text>
    <text x="26" y="148" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="17">visibility leaks.</text>
  </g>
  <path d="M274 321h48" stroke="#ffca28" stroke-width="6" stroke-linecap="round"/>
  <path d="M312 309l14 12-14 12" fill="none" stroke="#ffca28" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(340 236)">
    <rect x="0" y="0" width="178" height="170" rx="16" fill="#ffffff"/>
    <circle cx="36" cy="38" r="18" fill="#1c8c6f"/>
    <text x="30" y="45" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">2</text>
    <text x="26" y="88" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Fix</text>
    <text x="26" y="124" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="17">Improve titles,</text>
    <text x="26" y="148" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="17">types, attributes.</text>
  </g>
  <path d="M534 321h48" stroke="#ffca28" stroke-width="6" stroke-linecap="round"/>
  <path d="M572 309l14 12-14 12" fill="none" stroke="#ffca28" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(600 236)">
    <rect x="0" y="0" width="178" height="170" rx="16" fill="#ffffff"/>
    <circle cx="36" cy="38" r="18" fill="#1c8c6f"/>
    <text x="30" y="45" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">3</text>
    <text x="26" y="88" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Expand</text>
    <text x="26" y="124" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="17">Prepare the next</text>
    <text x="26" y="148" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="17">best channel.</text>
  </g>
  <path d="M794 321h48" stroke="#ffca28" stroke-width="6" stroke-linecap="round"/>
  <path d="M832 309l14 12-14 12" fill="none" stroke="#ffca28" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(860 236)">
    <rect x="0" y="0" width="178" height="170" rx="16" fill="#ffffff"/>
    <circle cx="36" cy="38" r="18" fill="#1c8c6f"/>
    <text x="30" y="45" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">4</text>
    <text x="26" y="88" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Monitor</text>
    <text x="26" y="124" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="17">Watch product</text>
    <text x="26" y="148" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="17">and feed signals.</text>
  </g>
  <path d="M949 426c-84 70-270 88-452 52-118-23-215-69-273-130" fill="none" stroke="#ffca28" stroke-width="6" stroke-linecap="round"/>
  <path d="M228 372l-12-28 30 9" fill="none" stroke="#ffca28" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="458" y="540" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">5. Improve again with better data</text>
</svg>
