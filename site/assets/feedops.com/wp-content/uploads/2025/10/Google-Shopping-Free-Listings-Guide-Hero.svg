    <g transform="translate(262 388)" filter="url(#soft)">
      <rect width="164" height="72" rx="14" fill="#ffffff"/>
      <text x="18" y="28" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#172033">Approval health</text>
      <circle cx="42" cy="51" r="15" fill="#e8f8ee"/>
      <path d="M35 51 L41 57 L51 45" fill="none" stroke="#24a148" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#172033">Clean</text>
