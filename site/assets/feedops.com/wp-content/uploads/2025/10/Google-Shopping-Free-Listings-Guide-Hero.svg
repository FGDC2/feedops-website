    <text x="0" y="76" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#fecf26">Free Listings</text>
    <text x="0" y="118" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#172033">Guide</text>

    <text x="0" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#647084">Turn product data into organic</text>
    <text x="0" y="194" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#647084">Shopping visibility across Google.</text>

    <g transform="translate(0 248)">
