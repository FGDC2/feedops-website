      <text x="18" y="28" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#172033">Organic traffic</text>
      <text x="18" y="57" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#24a148">+31%</text>
      <text x="82" y="56" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#647084">free clicks</text>
