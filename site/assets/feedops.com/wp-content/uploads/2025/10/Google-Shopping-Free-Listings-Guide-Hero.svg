          <text x="18" y="28" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#172033">Feed checks for free listings</text>
          <circle cx="24" cy="52" r="6" fill="#24a148"/>
          <text x="38" y="56" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#647084">IDs</text>
          <circle cx="76" cy="52" r="6" fill="#24a148"/>
          <text x="90" y="56" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#647084">Images</text>
