<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="536" viewBox="0 0 1024 536" role="img" aria-labelledby="title desc">
  <title id="title">Google Shopping Free Listings Guide</title>
  <desc id="desc">A FeedOps guide hero showing free Google Shopping listing eligibility and organic shopping surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef5f8"/>
    </linearGradient>
    <linearGradient id="yellowFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c7"/>
      <stop offset="1" stop-color="#fecf26"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34b34a"/>
      <stop offset="1" stop-color="#189247"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-18%" width="132%" height="142%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#172033" flood-opacity=".13"/>
