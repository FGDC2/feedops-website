      <text x="18" y="28" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#172033">Spend</text>
      <text x="18" y="57" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#172033">$0</text>
