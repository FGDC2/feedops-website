          <text x="170" y="56" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#647084">Shipping</text>
          <circle cx="244" cy="52" r="6" fill="#24a148"/>
          <text x="258" y="56" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#647084">Stock</text>
