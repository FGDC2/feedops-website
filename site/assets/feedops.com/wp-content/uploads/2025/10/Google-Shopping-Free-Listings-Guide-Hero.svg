          <rect x="13" y="16" width="58" height="35" rx="8" fill="#eef4ff"/>
          <path d="M24 44 L42 25 L62 44 Z" fill="#3978e5"/>
          <text x="19" y="70" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#172033">Shopping</text>
          <text x="31" y="82" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#172033">tab</text>
        </g>
        <g transform="translate(100 54)">
          <rect width="84" height="86" rx="12" fill="#ffffff" stroke="#dde5ee"/>
          <circle cx="38" cy="33" r="16" fill="none" stroke="#3267d6" stroke-width="7"/>
