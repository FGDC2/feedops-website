  <rect width="1024" height="536" fill="url(#bg)"/>
  <path d="M0 432 C110 476 205 482 322 448 C443 413 543 441 654 476 C779 516 894 497 1024 456 L1024 536 L0 536 Z" fill="#ffeaa1"/>
  <path d="M0 481 C103 523 215 525 335 493 C465 458 566 474 684 510 C807 547 925 519 1024 492 L1024 536 L0 536 Z" fill="url(#yellowFade)"/>

  <g transform="translate(50 54)">
