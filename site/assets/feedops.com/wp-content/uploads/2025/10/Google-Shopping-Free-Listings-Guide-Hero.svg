      <text x="66" y="18" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#172033">Enable free surfaces</text>
      <text x="66" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#647084">Shopping tab, Search, Images, panels.</text>
