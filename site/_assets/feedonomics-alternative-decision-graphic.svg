<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FeedOps versus broader syndication platform decision graphic</title>
  <desc id="desc">A comparison graphic showing when to choose FeedOps and when to choose a broader marketplace syndication platform.</desc>
  <rect width="1200" height="680" fill="#f5f8fb"/>
  <rect x="60" y="58" width="1080" height="564" rx="18" fill="#ffffff" stroke="#d9e0ea" stroke-width="2"/>
  <text x="100" y="122" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Which feed partner is the better fit?</text>
  <text x="100" y="166" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="22">Use the buying context to choose between proactive optimisation and broad syndication.</text>
  <rect x="100" y="226" width="460" height="300" rx="16" fill="#f5fbf8" stroke="#1c8c6f" stroke-opacity=".35" stroke-width="2"/>
  <rect x="640" y="226" width="460" height="300" rx="16" fill="#fffaf0" stroke="#ffca28" stroke-opacity=".75" stroke-width="2"/>
  <circle cx="136" cy="270" r="16" fill="#1c8c6f"/>
  <path d="M128 270l6 7 12-16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="166" y="266" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Choose FeedOps</text>
  <text x="166" y="298" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">when you need</text>
  <text x="128" y="356" fill="#176e58" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Proactive feed optimisation</text>
  <text x="128" y="400" fill="#3d4a5c" font-family="Inter, Arial, sans-serif" font-size="20">Expert advice, Merchant Center support,</text>
  <text x="128" y="430" fill="#3d4a5c" font-family="Inter, Arial, sans-serif" font-size="20">marketplace readiness, and channel expansion</text>
  <text x="128" y="460" fill="#3d4a5c" font-family="Inter, Arial, sans-serif" font-size="20">one channel at a time.</text>
  <circle cx="676" cy="270" r="16" fill="#ffca28"/>
  <path d="M668 270h16M676 262v16" fill="none" stroke="#101820" stroke-width="4" stroke-linecap="round"/>
  <text x="706" y="266" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Choose broader syndication</text>
  <text x="706" y="298" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">when you need</text>
  <text x="668" y="356" fill="#7a5a00" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Destination count is the main job</text>
  <text x="668" y="400" fill="#3d4a5c" font-family="Inter, Arial, sans-serif" font-size="20">Very large catalogues, many US marketplaces,</text>
  <text x="668" y="430" fill="#3d4a5c" font-family="Inter, Arial, sans-serif" font-size="20">and broad product data distribution are the</text>
  <text x="668" y="460" fill="#3d4a5c" font-family="Inter, Arial, sans-serif" font-size="20">primary requirements.</text>
  <rect x="100" y="558" width="1000" height="2" fill="#d9e0ea"/>
  <text x="100" y="596" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Decision shortcut:</text>
  <text x="294" y="596" fill="#3d4a5c" font-family="Inter, Arial, sans-serif" font-size="20">If the revenue leak is feed quality, start with optimisation before adding more destinations.</text>
</svg>
