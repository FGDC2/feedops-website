<svg xmlns="http://www.w3.org/2000/svg" width="1934" height="813" viewBox="0 0 1934 813" role="img" aria-labelledby="title desc">
  <title id="title">Shopping feed agency workflow</title>
  <desc id="desc">Shopping feed agency workflow showing how FeedOps works with media agencies and ecommerce clients to introduce, diagnose, execute, report, and support partner tools.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#111827" flood-opacity=".10"/>
    </filter>
    <linearGradient id="engineGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f8f5ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a06f"/>
    </marker>
    <style>
      .bg{fill:#fff}
      .card{fill:#fff;stroke:#d8dee8;stroke-width:2;filter:url(#shadow)}
      .soft{fill:#f7fafc;stroke:#d8dee8;stroke-width:2}
      .line{stroke:#cfd7e3;stroke-width:2}
      .dash{stroke:#7c6df4;stroke-width:4;stroke-dasharray:4 12;stroke-linecap:round}
      .flow{stroke:#16a06f;stroke-width:3;stroke-dasharray:8 10;fill:none;marker-end:url(#arrow)}
      .green{fill:#eaf7f1}
      .yellow{fill:#fff4df}
      .purple{fill:#eeeafe}
      .blue{fill:#edf5ff}
      .ink{fill:#101820;font-family:Inter,Arial,sans-serif;font-weight:850}
      .text{fill:#3e4a5c;font-family:Inter,Arial,sans-serif;font-weight:650}
      .muted{fill:#667487;font-family:Inter,Arial,sans-serif;font-weight:650}
      .small{font-size:18px}
      .xs{font-size:15px}
      .heading{font-size:25px}
      .num{fill:#10a064;font-family:Inter,Arial,sans-serif;font-size:34px;font-weight:950}
      .icon{fill:none;stroke:#344054;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .ok{stroke:#10a064}
      .warn{stroke:#f59e0b}
      .purpleStroke{stroke:#7c6df4}
    </style>
  </defs>

  <rect class="bg" width="1934" height="813"/>

  <g transform="translate(90 168)">
    <rect class="card" width="520" height="436" rx="18"/>
    <g transform="translate(34 34)">
      <rect class="green" width="76" height="76" rx="15"/>
      <path class="icon ok" d="M23 24h30v23H23zM38 47v13M29 60h18"/>
      <text class="ink heading" x="98" y="28">Introduce</text>
      <text class="text small" x="98" y="59">Agency brings FeedOps into</text>
      <text class="text small" x="98" y="84">the client conversation</text>
      <rect class="green" x="406" y="10" width="58" height="58" rx="12"/>
      <text class="num" x="424" y="49">1</text>
    </g>
    <line class="line" x1="34" y1="142" x2="486" y2="142"/>
    <g transform="translate(34 168)">
      <rect class="yellow" width="76" height="76" rx="15"/>
      <path class="icon warn" d="M38 19l24 11v18c0 15-10 26-24 30-14-4-24-15-24-30V30l24-11zM27 46l8 8 17-19"/>
      <text class="ink heading" x="98" y="28">Present</text>
      <text class="text small" x="98" y="59">FeedOps explains the feed</text>
      <text class="text small" x="98" y="84">opportunity and blockers</text>
      <rect class="yellow" x="406" y="10" width="58" height="58" rx="12"/>
      <text class="num" x="424" y="49" fill="#f59e0b">2</text>
    </g>
    <line class="line" x1="34" y1="276" x2="486" y2="276"/>
    <g transform="translate(34 302)">
      <rect class="purple" width="76" height="76" rx="15"/>
      <path class="icon purpleStroke" d="M38 16v14M38 46v14M16 38h14M46 38h14M23 23l10 10M43 43l10 10M53 23l-10 10M33 43l-10 10"/>
      <text class="ink heading" x="98" y="28">Execute</text>
      <text class="text small" x="98" y="59">Fixes, labels, approvals,</text>
      <text class="text small" x="98" y="84">and feed improvements</text>
      <rect class="purple" x="406" y="10" width="58" height="58" rx="12"/>
      <text class="num" x="424" y="49" fill="#7c6df4">3</text>
    </g>
  </g>

  <path class="dash" d="M640 386h80"/>

  <g transform="translate(750 188)">
    <rect x="0" y="0" width="385" height="390" rx="20" fill="url(#engineGlow)" stroke="#cfc7ff" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="194" cy="78" r="8" fill="#7c6df4"/>
    <circle cx="164" cy="108" r="8" fill="#c9c2ff"/>
    <circle cx="194" cy="108" r="8" fill="#ffc857"/>
    <circle cx="224" cy="108" r="8" fill="#7c6df4"/>
    <circle cx="164" cy="138" r="8" fill="#ffc857"/>
    <circle cx="194" cy="138" r="8" fill="#7c6df4"/>
    <circle cx="224" cy="138" r="8" fill="#c9c2ff"/>
    <text class="ink" x="100" y="190" font-size="32">FeedOps Engine</text>
    <text class="text small" x="122" y="223">Transform, validate</text>
    <text class="text small" x="138" y="248">and optimise</text>
    <g transform="translate(72 292)">
      <rect class="card" width="242" height="62" rx="12" filter="none"/>
      <path class="icon purpleStroke" d="M24 28l9 9 18-21" transform="scale(.7) translate(10 8)"/>
      <text class="text xs" x="50" y="25">Audit and detect issues</text>
      <path class="icon warn" d="M24 16l14 25H10z" transform="scale(.7) translate(12 40)"/>
      <text class="text xs" x="50" y="49">Fix and enrich automatically</text>
    </g>
  </g>

  <path class="dash" d="M1162 386h82"/>
  <g transform="translate(1264 354)">
    <rect class="green" width="64" height="64" rx="13"/>
    <path class="icon ok" d="M20 20h24v24H20zM26 26h12M26 32h12M26 38h12"/>
    <text class="muted xs" x="-8" y="98">Optimised</text>
    <text class="muted xs" x="-12" y="120">product feed</text>
  </g>

  <path class="flow" d="M1354 330h95"/>
  <path class="flow" d="M1354 386h95"/>
  <path class="flow" d="M1354 442h95"/>

  <g transform="translate(1464 150)">
    <rect class="card" width="330" height="470" rx="18"/>
    <text class="ink xs" x="28" y="44">Where campaigns scale</text>
    <g transform="translate(28 82)">
      <rect class="soft" width="274" height="62" rx="10"/>
      <rect class="yellow" x="16" y="15" width="32" height="32" rx="8"/>
      <text class="text xs" x="66" y="38">Google Shopping</text>
    </g>
    <g transform="translate(28 165)">
      <rect class="soft" width="274" height="62" rx="10"/>
      <rect class="blue" x="16" y="15" width="32" height="32" rx="8"/>
      <text class="text xs" x="66" y="38">PMax and Search</text>
    </g>
    <g transform="translate(28 248)">
      <rect class="soft" width="274" height="62" rx="10"/>
      <rect class="green" x="16" y="15" width="32" height="32" rx="8"/>
      <text class="text xs" x="66" y="38">Meta catalogues</text>
    </g>
    <g transform="translate(28 331)">
      <rect class="soft" width="274" height="62" rx="10"/>
      <rect class="purple" x="16" y="15" width="32" height="32" rx="8"/>
      <text class="text xs" x="66" y="38">Marketplaces</text>
    </g>
  </g>

  <g transform="translate(360 664)">
    <rect class="card" width="780" height="90" rx="16"/>
    <g transform="translate(34 17)">
      <circle class="green" cx="28" cy="28" r="28"/>
      <path class="icon ok" d="M16 38l12-12 8 8 14-20" transform="scale(.75) translate(8 8)"/>
      <text class="ink small" x="76" y="28">Partner tools</text>
      <text class="text xs" x="76" y="54">Audit more client feeds</text>
    </g>
    <line class="line" x1="390" y1="18" x2="390" y2="72"/>
    <g transform="translate(430 17)">
      <circle class="purple" cx="28" cy="28" r="28"/>
      <path class="icon purpleStroke" d="M4 30s12-16 28-16 28 16 28 16-12 16-28 16S4 30 4 30zM32 22a8 8 0 100 16 8 8 0 000-16z" transform="scale(.65) translate(12 16)"/>
      <text class="ink small" x="76" y="28">Partner terms</text>
      <text class="text xs" x="76" y="54">Discussed privately</text>
    </g>
  </g>
</svg>
