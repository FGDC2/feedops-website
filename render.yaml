services:
  - type: web
    name: feedops-website
    runtime: static
    buildCommand: node scripts/build-render-site.mjs
    staticPublishPath: ./render-site
    renderSubdomainPolicy: disabled
    autoDeployTrigger: commit
    routes:
      - type: redirect
        source: /executive
        destination: /product-feed-management/
      - type: redirect
        source: /executive/*
        destination: /product-feed-management/
      - type: redirect
        source: /agency
        destination: /shopping-feed-agency/
      - type: redirect
        source: /agency/*
        destination: /shopping-feed-agency/
      - type: redirect
        source: /admin
        destination: /
      - type: redirect
        source: /admin/*
        destination: /
